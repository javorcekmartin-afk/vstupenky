<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generátor vstupeniek – TJ Záhoran Kostolište</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2ee;color:#111}
.bar{position:sticky;top:0;z-index:5;background:#fff;padding:14px;border-bottom:1px solid #ddd}
.bar h1{font-size:19px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
.f input,.f select{width:100%;padding:8px;border:1px solid #bbb;border-radius:6px;background:#fff}
.actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 14px;border:0;border-radius:6px;font-weight:700;cursor:pointer}
.go{background:#2e9d47;color:#fff}
.print{background:#e8ece8}
.hint{font-size:12px;color:#555;margin-top:8px}
#pages{padding:16px 0}

.page{
  width:210mm;height:297mm;margin:0 auto 12px;background:#fff;padding:5mm;
  display:grid;grid-template-columns:repeat(2,98mm);column-gap:4mm;
  justify-content:center;align-content:center;box-shadow:0 2px 14px #0002;
  page-break-after:always;
}
.m12{grid-template-rows:repeat(6,46mm);row-gap:2mm}
.m10{grid-template-rows:repeat(5,54mm);row-gap:3mm}
.m6{grid-template-rows:repeat(3,72mm);row-gap:8mm}

.ticket{
  width:98mm;height:100%;border:1mm solid #49a94f;
  display:grid;grid-template-columns:20mm 1fr 19mm 14mm;
  overflow:hidden;background:#fff;
}
.home,.away{display:flex;align-items:center;justify-content:center;position:relative;padding:1mm}
.home img,.away img{max-width:16mm;max-height:21mm;object-fit:contain}
.match{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1mm}
.hn,.an{font-size:7.8pt;font-weight:800;line-height:1.05}
.vs{font-size:7.5pt;font-weight:800;margin:.4mm 0}
.info{margin-top:1mm;width:100%;max-width:42mm;border-top:.55mm dotted #111;display:grid;grid-template-columns:1fr 1fr}
.info>div{text-align:center;padding-top:.6mm}
.info>div+div{border-left:.55mm dotted #111}
.lbl{font-size:6.5pt;font-weight:800}
.val{font-size:6.9pt;font-weight:700}
.num1{position:absolute;left:1mm;bottom:1mm;font-size:10pt;font-weight:800}
.stub{border-left:.7mm dotted #111;display:flex;align-items:center;justify-content:center}
.stub span{transform:rotate(-90deg);font-size:14pt;font-weight:800}

.m6 .hn,.m6 .an{font-size:8.7pt}
.m6 .vs{font-size:8.4pt}
.m6 .lbl{font-size:7.1pt}
.m6 .val{font-size:7.5pt}
.m6 .home img,.m6 .away img{max-width:18mm;max-height:24mm}
.m6 .num1{font-size:11pt}
.m6 .stub span{font-size:15pt}

.fs-small .hn,.fs-small .an{font-size:6.9pt}
.fs-small .vs{font-size:6.7pt}
.fs-small .lbl{font-size:5.8pt}
.fs-small .val{font-size:6.2pt}

.fs-large .hn,.fs-large .an{font-size:8.7pt}
.fs-large .vs{font-size:8.3pt}
.fs-large .lbl{font-size:7pt}
.fs-large .val{font-size:7.4pt}

.fs-xlarge .hn,.fs-xlarge .an{font-size:9.4pt}
.fs-xlarge .vs{font-size:8.9pt}
.fs-xlarge .lbl{font-size:7.5pt}
.fs-xlarge .val{font-size:8pt}

.num-medium .num1{font-size:9pt}
.num-medium .stub span{font-size:12pt}
.num-large .num1{font-size:11pt}
.num-large .stub span{font-size:16pt}
.num-xlarge .num1{font-size:13pt}
.num-xlarge .stub span{font-size:19pt}

@media(max-width:900px){
  .grid{grid-template-columns:1fr 1fr}
  .page{transform-origin:top left;transform:scale(.48);margin-bottom:-150mm}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
}
@media print{
  .bar{display:none!important}
  body{background:#fff}
  #pages{padding:0}
  .page{margin:0;box-shadow:none;transform:none!important}
  @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<div class="bar">
  <h1>Generátor vstupeniek – TJ Záhoran Kostolište</h1>
  <div class="grid">
    <div class="f"><label>Súper</label><input id="op" value="TJ SLOVAN VIŠTUK"></div>
    <div class="f"><label>Dátum</label><input id="dt" value="10.08.2026"></div>
    <div class="f"><label>Čas</label><input id="tm" value="17:30"></div>
    <div class="f"><label>Prvé číslo</label><input id="sn" type="number" min="1" value="1"></div>
    <div class="f"><label>Počet vstupeniek</label><input id="ct" type="number" min="1" max="1000" value="150"></div>
    <div class="f">
      <label>Na jednu A4</label>
      <select id="pp">
        <option value="12">12 ks (2 × 6)</option>
        <option value="10">10 ks (2 × 5)</option>
        <option value="6">6 ks (2 × 3)</option>
      </select>
    </div>
    <div class="f">
      <label>Veľkosť písma</label>
      <select id="fs">
        <option value="small">Menšie</option>
        <option value="normal" selected>Štandard</option>
        <option value="large">Väčšie</option>
        <option value="xlarge">Najväčšie</option>
      </select>
    </div>
    <div class="f">
      <label>Veľkosť čísiel</label>
      <select id="ns">
        <option value="medium">Stredné</option>
        <option value="large" selected>Veľké</option>
        <option value="xlarge">Extra veľké</option>
      </select>
    </div>
    <div class="f"><label>Logo súpera</label><input id="lg" type="file" accept="image/*"></div>
  </div>

  <div class="actions">
    <button class="go" id="gen">Vygenerovať vstupenky</button>
    <button class="print" id="prn">Tlačiť / uložiť ako PDF</button>
  </div>
  <div class="hint">Čísla sú predvolene väčšie. Veľkosť textu aj čísiel môžete meniť samostatne.</div>
</div>

<div id="pages"></div>

<script>
const HOME='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////2wBDAf//////////////////////////////////////////////////////////////////////////////////////wAARCAA8ADwDASIAAhEBAxEB/8QAHQAAAgIDAQEBAAAAAAAAAAAABQYEBwECAwgJCP/EAEIQAAEDAgMFBgMGBgMBAAAAAAECAwQABREGEiExQVEHEyJhcYGRMqGxwdHwFCNSYnKCkuEVFiQzQ1OCk7LxJDRD/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EAC8RAQEAAgIBAwMDAwUAAAAAAAAAAQIDEQQSITFBEyJRYXGBkaGx0RQyQlLB8P/aAAwDAQACEQMRAD8A7JpStf0UE0pWuKKVQjNKUoFApSlKAUpSlAKUpSgFKUpQClKUoBSlKUApSlKAUpSlAKUpSgFKUpQClKUoBSlKUApSlKAUpSlAKUpSgFKUpQClKUoBSlKUApSlKAUpSlAKUpSgFKUpQClKUoBSlKAUf/2Q==' ;
let AWAY='';
const $=id=>document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(x){return String(x).padStart(3,'0')}

function ticket(n,op,dt,tm){
  const q=num(n);
  return `<div class="ticket">
    <div class="home">
      <img src="${HOME}" alt="TJ Záhoran Kostolište">
      <div class="num1">${q}</div>
    </div>
    <div class="match">
      <div class="hn">TJ ZÁHORAN KOSTOLIŠTE</div>
      <div class="vs">VS.</div>
      <div class="an">${esc(op)}</div>
      <div class="info">
        <div><div class="lbl">DÁTUM</div><div class="val">${esc(dt)}</div></div>
        <div><div class="lbl">ČAS</div><div class="val">${esc(tm)}</div></div>
      </div>
    </div>
    <div class="away">${AWAY?`<img src="${AWAY}" alt="Logo súpera">`:''}</div>
    <div class="stub"><span>${q}</span></div>
  </div>`;
}

function generate(){
  const op=$('op').value.trim()||'SÚPER';
  const dt=$('dt').value.trim();
  const tm=$('tm').value.trim();
  const sn=Math.max(1,parseInt($('sn').value||1,10));
  const ct=Math.max(1,Math.min(1000,parseInt($('ct').value||150,10)));
  const pp=parseInt($('pp').value,10);
  const fs=$('fs').value;
  const ns=$('ns').value;

  $('pages').innerHTML='';
  const pages=Math.ceil(ct/pp);

  for(let p=0;p<pages;p++){
    const d=document.createElement('div');
    d.className='page '+(pp===6?'m6':pp===10?'m10':'m12')+' fs-'+fs+' num-'+ns;
    let h='';
    for(let i=0;i<pp;i++){
      const ix=p*pp+i;
      if(ix<ct) h+=ticket(sn+ix,op,dt,tm);
    }
    d.innerHTML=h;
    $('pages').appendChild(d);
  }
}

$('lg').addEventListener('change',ev=>{
  const f=ev.target.files && ev.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=x=>{AWAY=x.target.result;generate()};
  r.readAsDataURL(f);
});

$('gen').onclick=generate;
$('prn').onclick=()=>{generate();setTimeout(()=>window.print(),120)};

['op','dt','tm','sn','ct','pp','fs','ns'].forEach(id=>$(id).addEventListener('change',generate));
generate();
</script>
</body>
</html>
