<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generátor vstupeniek – TJ Záhoran Kostolište</title><link rel="stylesheet" href="style.css"></head><body><div class="bar"><h1>Generátor vstupeniek – TJ Záhoran Kostolište</h1><div class="grid"><div><label for="opponent">Súper</label><input id="opponent" value="TJ SLOVAN VIŠTUK"></div><div><label for="date">Dátum</label><input id="date" value="10.08.2026"></div><div><label for="time">Čas</label><input id="time" value="17:30"></div><div><label for="startNo">Prvé číslo</label><input id="startNo" type="number" min="1" value="1"></div><div><label for="count">Počet vstupeniek</label><input id="count" type="number" min="1" max="1000" value="150"></div><div><label for="perPage">Na jednu A4</label><select id="perPage"><option value="12">12 ks (2 × 6)</option><option value="10">10 ks (2 × 5)</option><option value="6">6 ks (2 × 3)</option></select></div><div><label for="fontSize">Veľkosť písma</label><select id="fontSize"><option value="small">Menšie</option><option value="normal" selected>Štandard</option><option value="large">Väčšie</option><option value="xlarge">Najväčšie</option></select></div><div><label for="numberSize">Veľkosť čísiel</label><select id="numberSize"><option value="medium">Stredné</option><option value="large" selected>Veľké</option><option value="xlarge">Extra veľké</option></select></div><div><label for="logoInput">Logo súpera</label><input id="logoInput" type="file" accept="image/*"></div></div><div class="actions"><button class="go" id="generateBtn">Vygenerovať vstupenky</button><button class="print" id="printBtn">Tlačiť / uložiť ako PDF</button></div><div class="hint">Naše logo je napevno vložené v generátore. Môžete meniť veľkosť písma, čísiel a počet lístkov na A4.</div></div><div id="pages"></div><script src="home-logo.js"></script><script src="app.js"></script></body></html>
